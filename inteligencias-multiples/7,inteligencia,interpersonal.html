<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🤝 SOCIAL MIND | Inteligencia Interpersonal - Conecta con los demás</title>
    
  <link rel="stylesheet" href="7,inteligencia,interpersonal.css">
</head>
<body>
<div class="social-app">
    <div class="social-header">
        <div>
            <h1>🤝 SOCIAL MIND</h1>
            <p style="color: #60A5FA;">Empatía · Comunicación · Trabajo en equipo · Habilidades sociales</p>
        </div>
        <div class="social-stats">
            <div class="social-stat"><div class="social-stat-label">🏆 PUNTOS</div><div class="social-stat-value" id="pointsTotal">0</div></div>
            <div class="social-stat"><div class="social-stat-label">✨ COMPLETADOS</div><div class="social-stat-value" id="completedCount">0/7</div></div>
            <div class="social-stat"><div class="social-stat-label">🎯 RANGO</div><div class="social-stat-value" id="rankLabel">NOVATO</div></div>
        </div>
    </div>

    <div class="modules-grid" id="modulesGrid"></div>
    <div class="progress-bar"><div class="progress-fill" id="globalProgress"></div></div>
    <footer>🤝 Conecta con los demás · Desarrolla tu inteligencia interpersonal</footer>
</div>

<div class="final-screen" id="finalPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div><h2 id="finalRank" style="color:#3B82F6;">🏆 MAESTRO SOCIAL</h2><p id="finalMsg" style="color:#CBD5E1;"></p></div>
        <button class="btn btn-primary" id="closeFinalBtn">✨ Continuar</button>
    </div>
</div>

<div class="modal-social" id="socialModal">
    <div class="modal-social-content">
        <div class="modal-social-header" id="modalTitle">Habilidad Social</div>
        <div id="modalBody"></div>
        <div class="modal-buttons">
            <button class="btn btn-secondary" id="closeModalBtn">Cancelar</button>
            <button class="btn btn-primary" id="submitModalBtn">✅ Completar</button>
        </div>
    </div>
</div>


  <script src="7,inteligencia,interpersonal.js"></script>
</body>
</html>
