<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎵 MUSICAL MIND | Inteligencia Musical - Entrenamiento Profesional</title>
    
  <link rel="stylesheet" href="4.inteliencia.musical.css">
</head>
<body>
<div class="app-container">
    <div class="music-header">
        <div class="title-music">
            <h1>🎵 MUSICAL MIND</h1>
            <p>Entrena tu inteligencia musical · Piano · Ritmo · Oído absoluto</p>
        </div>
        <div class="stats-music">
            <div class="stat-music"><div class="stat-label-music">🏆 PUNTOS</div><div class="stat-value-music" id="totalPointsDisplay">0</div></div>
            <div class="stat-music"><div class="stat-label-music">⚡ COMPLETADOS</div><div class="stat-value-music" id="completedDisplay">0/7</div></div>
            <div class="stat-music"><div class="stat-label-music">🎯 RANGO</div><div class="stat-value-music" id="rankDisplayMusic">NOVATO</div></div>
        </div>
    </div>

    <div class="challenge-grid" id="challengesContainer"></div>
    <div class="progress-container"><div class="progress-fill-music" id="globalProgressBar"></div></div>
    <footer>🎹 Toca las teclas del piano · Escucha los sonidos · Entrena tu percepción musical</footer>
</div>

<div class="final-screen" id="finalPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div><h2 id="finalRankTitle" style="color:#E879F9;">🏆 MAESTRO MUSICAL</h2><p id="finalMessageText" style="color:#CBD5E1;"></p></div>
        <button class="btn-music btn-primary-music" id="closeFinalBtn">✨ Continuar</button>
    </div>
</div>

<div class="modal-music" id="musicModal">
    <div class="modal-music-content">
        <div class="modal-music-header" id="modalTitleMusic">Desafío Musical</div>
        <div id="modalBodyMusic"></div>
        <div class="modal-buttons">
            <button class="btn-music btn-secondary-music" id="closeModalBtn">Cancelar</button>
            <button class="btn-music btn-primary-music" id="submitAnswerBtn">🔍 Verificar</button>
        </div>
    </div>
</div>


  <script src="4.inteliencia.musical.js"></script>
</body>
</html>
