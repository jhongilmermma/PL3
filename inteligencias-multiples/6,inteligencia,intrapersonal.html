<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🌿 MENTE EN CALMA | Espacio de Inteligencia Intrapersonal</title>
    
  <link rel="stylesheet" href="6,inteligencia,intrapersonal.css">
</head>
<body>
<div class="mindful-container">
    <div class="zen-header">
        <div>
            <h1>🌿 MENTE EN CALMA</h1>
            <p style="color: #6EE7B7;">Tu espacio personal · Autoconocimiento · Paz interior</p>
        </div>
        <div class="zen-stats">
            <div class="zen-stat"><div class="zen-stat-label">🏆 PUNTOS</div><div class="zen-stat-value" id="pointsTotal">0</div></div>
            <div class="zen-stat"><div class="zen-stat-label">✨ PRÁCTICAS</div><div class="zen-stat-value" id="practicesDone">0/7</div></div>
            <div class="zen-stat"><div class="zen-stat-label">🎯 RANGO</div><div class="zen-stat-value" id="rankLabel">NOVATO</div></div>
        </div>
    </div>

    <div class="practices-grid" id="practicesGrid"></div>
    <div class="progress-bar"><div class="progress-fill" id="globalProgress"></div></div>
    <footer>🌱 Cada práctica es un paso hacia adentro · Respira, reflexiona, crece</footer>
</div>

<div class="final-screen" id="finalPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div><h2 id="finalRank" style="color:#34D399;">🏆 MAESTRO INTERIOR</h2><p id="finalMsg" style="color:#CBD5E1;"></p></div>
        <button class="btn btn-primary" id="closeFinalBtn">✨ Seguir</button>
    </div>
</div>

<div class="modal-mindful" id="mindfulModal">
    <div class="modal-mindful-content">
        <div class="modal-mindful-header" id="modalTitle">Práctica Interior</div>
        <div id="modalBody"></div>
        <div class="modal-buttons">
            <button class="btn btn-secondary" id="closeModalBtn">Cerrar</button>
            <button class="btn btn-primary" id="submitModalBtn">✨ Completar</button>
        </div>
    </div>
</div>


  <script src="6,inteligencia,intrapersonal.js"></script>
</body>
</html>s
