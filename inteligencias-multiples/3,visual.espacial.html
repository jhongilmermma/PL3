
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎨 SPATIAL 3D | Inteligencia Visual-Espacial Profesional</title>
    
  <link rel="stylesheet" href="3,visual.espacial.css">
</head>
<body>
<div class="app-container">
    <div class="header-pro">
        <div class="title-pro">
            <h1>🎨 SPATIAL 3D MASTERY</h1>
            <p style="color:#94A3B8; font-size:0.8rem;">Rotación mental · Cubos 3D · Simetría · Percepción espacial</p>
        </div>
        <div class="stats-pro">
            <div class="stat-pro"><div class="stat-label-pro">🏆 PUNTOS</div><div class="stat-value-pro" id="totalPointsDisplay">0</div></div>
            <div class="stat-pro"><div class="stat-label-pro">⚡ COMPLETADOS</div><div class="stat-value-pro" id="completedDisplay">0/8</div></div>
            <div class="stat-pro"><div class="stat-label-pro">🎯 RANGO</div><div class="stat-value-pro" id="rankDisplayPro">NOVATO</div></div>
        </div>
    </div>

    <div class="challenge-grid" id="challengesContainer"></div>
    <div class="progress-container"><div class="progress-fill-spatial" id="globalProgressBar"></div></div>
    <footer>🧠 Desafíos 3D interactivos · Gira, rota y visualiza formas tridimensionales</footer>
</div>

<div class="final-screen-spatial" id="finalPanelSpatial">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div><h2 id="finalRankTitle" style="color:#60A5FA;">🏆 MAESTRO 3D</h2><p id="finalMessageText" style="color:#CBD5E1;"></p></div>
        <button class="btn-pro btn-primary-pro" id="closeFinalSpatialBtn">✨ Continuar</button>
    </div>
</div>

<div class="modal-spatial" id="spatialModal">
    <div class="modal-spatial-content">
        <div class="modal-spatial-header" id="modalTitleSpatial">Desafío Visual 3D</div>
        <div id="modalBodySpatial"></div>
        <div class="modal-buttons">
            <button class="btn-pro btn-secondary-pro" id="closeSpatialModalBtn">Cancelar</button>
            <button class="btn-pro btn-primary-pro" id="submitSpatialAnswerBtn">🔍 Verificar</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="3,visual.espacial.js"></script>
</body>
</html>
