<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🌿 ECO MIND | Inteligencia Naturalista - Explorador de Ecosistemas</title>
    
  <link rel="stylesheet" href="8,inteligencia,naturalizta.css">
</head>
<body>
<div class="eco-app">
    <div class="eco-header">
        <div>
            <h1>🌿 ECO MIND</h1>
            <p style="color: #86EFAC;">Inteligencia Naturalista · Biodiversidad · Sostenibilidad · Observación</p>
        </div>
        <div class="eco-stats">
            <div class="eco-stat"><div class="eco-stat-label">🏆 PUNTOS</div><div class="eco-stat-value" id="pointsTotal">0</div></div>
            <div class="eco-stat"><div class="eco-stat-label">✨ COMPLETADOS</div><div class="eco-stat-value" id="completedCount">0/7</div></div>
            <div class="eco-stat"><div class="eco-stat-label">🎯 RANGO</div><div class="eco-stat-value" id="rankLabel">NOVATO</div></div>
        </div>
    </div>

    <div class="modules-grid" id="modulesGrid"></div>
    <div class="progress-bar"><div class="progress-fill" id="globalProgress"></div></div>
    <footer>🌍 Conecta con la naturaleza · Observa, clasifica y protege nuestro planeta</footer>
</div>

<div class="final-screen" id="finalPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div><h2 id="finalRank" style="color:#22C55E;">🏆 GUARDIÁN DE LA TIERRA</h2><p id="finalMsg" style="color:#CBD5E1;"></p></div>
        <button class="btn btn-primary" id="closeFinalBtn">✨ Continuar</button>
    </div>
</div>

<div class="modal-eco" id="ecoModal">
    <div class="modal-eco-content">
        <div class="modal-eco-header" id="modalTitle">🌿 Explorador Naturalista</div>
        <div id="modalBody"></div>
        <div class="modal-buttons">
            <button class="btn btn-secondary" id="closeModalBtn">Cancelar</button>
            <button class="btn btn-primary" id="submitModalBtn">🌱 Completar</button>
        </div>
    </div>
</div>


  <script src="8,inteligencia,naturalizta.js"></script>
</body>
</html>
