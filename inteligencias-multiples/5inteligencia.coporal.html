<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎯 KINESTHETIC PRO | Entrenamiento de Inteligencia Corporal</title>
    
  <link rel="stylesheet" href="5inteligencia.coporal.css">
</head>
<body>
<div class="app">
    <div class="premium-header">
        <div class="title-section">
            <h1>🎯 KINESTHETIC PRO</h1>
            <p>Entrenamiento de inteligencia corporal · Reflejos · Coordinación · Control motor</p>
        </div>
        <div class="stats-panel">
            <div class="stat-item"><div class="stat-label">🏆 PUNTOS</div><div class="stat-value" id="pointsTotal">0</div></div>
            <div class="stat-item"><div class="stat-label">✨ NIVELES</div><div class="stat-value" id="levelsDone">0/7</div></div>
            <div class="stat-item"><div class="stat-label">🎯 RANGO</div><div class="stat-value" id="rankLabel">NOVATO</div></div>
        </div>
    </div>

    <div class="modules-grid" id="modulesGrid"></div>
    <div class="progress-wrapper"><div class="progress-fill" id="globalFill"></div></div>
    <footer>💪 Cada módulo entrena una habilidad corporal diferente · Completa para desbloquear el siguiente</footer>
</div>

<div class="final-screen" id="finalPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div><h2 id="finalRank" style="color:#F97316;">🏆 MAESTRO CORPORAL</h2><p id="finalMsg" style="color:#CBD5E1;"></p></div>
        <button class="btn-pro btn-primary-pro" id="closeFinalBtn">✨ Continuar</button>
    </div>
</div>

<div class="modal-pro" id="gameModal">
    <div class="modal-pro-content">
        <div class="modal-pro-header" id="modalTitle">Desafío Corporal</div>
        <div id="modalBody"></div>
        <div class="modal-buttons-pro">
            <button class="btn-pro btn-secondary-pro" id="closeModalBtn">Cancelar</button>
            <button class="btn-pro btn-primary-pro" id="submitModalBtn">✅ Verificar</button>
        </div>
    </div>
</div>


  <script src="5inteligencia.coporal.js"></script>
</body>
</html>
