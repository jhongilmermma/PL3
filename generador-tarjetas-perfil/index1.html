<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Perfiles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Editor de Perfil</h1>
        
        <div class="form-group">
            <label>Nombre (Cadena):</label>
            <input type="text" id="inputNombre" placeholder="Ej: Edith">

            <label>Paterno (Cadena):</label>
            <input type="text" id="inputPaterno" placeholder="Ej: Ramos">

            <label>Materno(Cadena):</label>
            <input type="text" id="inputMaterno" placeholder="Ej: Beltran">

            
            <label>Año de Nacimiento (Cuantitativo):</label>
            <input type="number" id="inputAnio" placeholder="Ej: 1995">
            
            <label>Estado (Cualitativo):</label>
            <select id="inputEstado">
                <option value="Disponible">Disponible</option>
                <option value="Ocupado">Ocupado</option>
                <option value="Fuera de línea">Fuera de línea</option>
            </select>
        </div>

        <button onclick="generarPerfil()">Actualizar Perfil</button>

        <div id="card" class="profile-card">
            <h2 id="displayNombre">Nombre</h2>
            <h2 id="displayPaterno">Paterno</h2>
            <h2 id="displayMaterno">Materno</h2>
            <p id="displayEdad">Edad: --</p>
            <p id="displayEstado" class="status">Estado: --</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
