<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort Pro - Clasificador Premium</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
    
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Eco<span>Sort</span></h1>
        <p style="color: #64748b;">Clasificador de Residuos</p>
    </header>

    <div class="search-box">
        <input type="text" id="residueInput" placeholder="Ej: Papel, botella, platano..." onkeyup="classify()">
    </div>

    <div id="resultCard" class="result-card hidden">
        <div class="bin-wrapper">
            <svg class="bin-icon" id="binSvg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="emoji-overlay" id="resIcon">🍎</span>
        </div>
        <h2 id="resName" style="margin: 0 0 10px 0; font-size: 1.2rem;"></h2>
        <div class="badge" id="resColor"></div>
        <p id="resInstructions" style="font-size: 0.9rem; color: #475569; line-height: 1.5;"></p>
    </div>
</div>



  <script src="script.js"></script>
</body>
</html>
