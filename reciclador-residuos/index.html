<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort Pro - Clasificador Premium</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
    <style>
        :root {
            --p-green: #00d084;
            --p-blue: #007aff;
            --p-yellow: #ffcc00;
            --p-brown: #8b4513;
            --bg-main: #fcfcfd;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f0f2f5 radial-gradient(circle at top right, rgba(0,208,132,0.1), transparent);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid white;
        }

        header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            color: #1a1a1a;
        }

        header h1 span { color: var(--p-green); }

        .search-box {
            margin: 30px 0;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 18px 24px;
            border-radius: 20px;
            border: 2px solid transparent;
            background: #f1f3f5;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            background: white;
            border-color: var(--p-green);
            box-shadow: 0 10px 20px -10px rgba(0, 208, 132, 0.3);
        }

        /* Tacho Animado */
        .bin-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .bin-icon {
            width: 100%;
            height: 100%;
            stroke: #cbd5e0;
            transition: var(--transition);
        }

        .emoji-overlay {
            position: absolute;
            font-size: 2.5rem;
            top: 40%;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .result-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Colores dinámicos */
        .bg-blue { background: var(--p-blue); }
        .bg-yellow { background: var(--p-yellow); color: #333; }
        .bg-green { background: var(--p-green); }
        .bg-brown { background: var(--p-brown); }

        .color-blue { stroke: var(--p-blue); }
        .color-yellow { stroke: var(--p-yellow); }
        .color-green { stroke: var(--p-green); }
        .color-brown { stroke: var(--p-brown); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Eco<span>Sort</span></h1>
        <p style="color: #64748b;">Clasificador de Residuos</p>
    </header>

    <div class="search-box">
        <input type="text" id="residueInput" placeholder="Ej: Papel, botella, platano..." onkeyup="classify()">
    </div>

    <div id="resultCard" class="result-card hidden">
        <div class="bin-wrapper">
            <svg class="bin-icon" id="binSvg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="emoji-overlay" id="resIcon">🍎</span>
        </div>
        <h2 id="resName" style="margin: 0 0 10px 0; font-size: 1.2rem;"></h2>
        <div class="badge" id="resColor"></div>
        <p id="resInstructions" style="font-size: 0.9rem; color: #475569; line-height: 1.5;"></p>
    </div>
</div>

<script>
    const db = {
        "papel": { color: "bg-blue", stroke: "color-blue", label: "Azul", icon: "📄", note: "Depositar seco y limpio." },
        "carton": { color: "bg-blue", stroke: "color-blue", label: "Azul", icon: "📦", note: "Desarmar las cajas para ahorrar espacio." },
        "botella": { color: "bg-yellow", stroke: "color-yellow", label: "Amarillo", icon: "🍼", note: "Envases de plástico y latas de metal." },
        "latas": { color: "bg-yellow", stroke: "color-yellow", label: "Amarillo", icon: "🥫", note: "Enjuagar antes de depositar." },
        "vidrio": { color: "bg-green", stroke: "color-green", label: "Verde", icon: "🍾", note: "Solo botellas y frascos sin tapa." },
        "platano": { color: "bg-brown", stroke: "color-brown", label: "Marrón", icon: "🍌", note: "Residuo orgánico. Ideal para abono." },
        "manzana": { color: "bg-brown", stroke: "color-brown", label: "Marrón", icon: "🍎", note: "Restos de fruta y comida." },
        "comida": { color: "bg-brown", stroke: "color-brown", label: "Marrón", icon: "🍲", note: "Restos de alimentos orgánicos." }
    };

    function classify() {
        const val = document.getElementById('residueInput').value.toLowerCase().trim();
        const card = document.getElementById('resultCard');
        
        if(val.length > 2) {
            let found = false;
            for (let key in db) {
                if (key.includes(val) || val.includes(key)) {
                    show(key.toUpperCase(), db[key]);
                    found = true;
                    break;
                }
            }
            if(!found) card.classList.add('hidden');
        } else {
            card.classList.add('hidden');
        }
    }

    function show(name, data) {
        const card = document.getElementById('resultCard');
        document.getElementById('resName').innerText = name;
        document.getElementById('resIcon').innerText = data.icon;
        document.getElementById('resInstructions').innerText = data.note;
        
        const badge = document.getElementById('resColor');
        badge.innerText = `Contenedor ${data.label}`;
        badge.className = `badge ${data.color}`;
        
        document.getElementById('binSvg').setAttribute('class', `bin-icon ${data.stroke}`);
        card.classList.remove('hidden');
    }
</script>

</body>
</html>
