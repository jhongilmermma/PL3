<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz L Profesional</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">

        <h1>Matriz Forma de L</h1>

        <p>
            La letra L estará marcada con 1
            y el resto con 0
        </p>

        <input 
            type="number" 
            id="orden" 
            placeholder="Ingrese N"
            min="1"
        >

        <button onclick="crearMatrizL()">
            Generar Matriz
        </button>

        <div id="matriz"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
