<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinergia HIS | Módulo de Triage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hosp-container">
        <aside class="sidebar-entry">
            <div class="hosp-brand">
                <div class="cross">✚</div>
                <div>
                    <h2>Sinergia<span>HIS</span></h2>
                    <small>Área de Emergencias</small>
                </div>
            </div>

            <div class="form-flow">
                <div class="form-section">
                    <label class="section-tag">Admisión</label>
                    <input type="text" id="pName" placeholder="Nombres y Apellidos">
                    <input type="number" id="pAge" placeholder="Edad">
                </div>

                <div class="form-section">
                    <label class="section-tag">Valoración Primaria (ABC)</label>
                    <div class="abc-check">
                        <span>¿Paciente respira/tiene pulso?</span>
                        <div class="toggle-switch">
                            <button id="abcSi" class="active" onclick="setABC(true)">SÍ</button>
                            <button id="abcNo" onclick="setABC(false)">NO</button>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <label class="section-tag">Funciones Vitales</label>
                    <div class="vital-grid">
                        <div class="v-input">
                            <label>FC (lpm)</label>
                            <input type="number" id="vFC" placeholder="--">
                        </div>
                        <div class="v-input">
                            <label>SatO2 (%)</label>
                            <input type="number" id="vSat" placeholder="--">
                        </div>
                        <div class="v-input">
                            <label>Temp (°C)</label>
                            <input type="number" id="vTemp" placeholder="--" step="0.1">
                        </div>
                        <div class="v-input">
                            <label>Dolor (0-10)</label>
                            <input type="number" id="vDolor" placeholder="0">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <label class="section-tag">Motivo de Consulta (Hallazgo)</label>
                    <select id="vSintoma">
                        <option value="normal">Síntomas Leves (Resfrío, Dolor leve)</option>
                        <option value="pecho">Dolor Torácico (Pecho/Brazo)</option>
                        <option value="neuro">Dificultad para hablar / Parálisis facial</option>
                        <option value="hemorragia">Hemorragia Profusa</option>
                        <option value="trauma">Trauma por Accidente</option>
                    </select>
                </div>

                <button class="btn-submit" onclick="evalTriage()">Finalizar Triage</button>
            </div>
        </aside>

        <main class="monitor-area">
            <div id="idle" class="idle-screen">
                <h3>Monitor de Triage</h3>
                <p>Ingrese los datos del paciente para asignar prioridad.</p>
            </div>

            <div id="result" class="result-card hidden">
                <div id="prioBanner" class="prio-banner">
                    <h1 id="prioLabel">PRIORIDAD I</h1>
                    <span id="prioTime">ATENCIÓN INMEDIATA</span>
                </div>

                <div class="report-content">
                    <div class="report-row">
                        <span>PACIENTE:</span>
                        <strong id="resName">--</strong>
                    </div>
                    <div class="report-row">
                        <span>ASIGNACIÓN:</span>
                        <strong id="resArea">--</strong>
                    </div>
                    <hr>
                    <div class="clinical-note">
                        <label>Observaciones de Enfermería:</label>
                        <p id="resNote">--</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
